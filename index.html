<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Practice of Innovation · Complete Course</title><style>

adding:17px;border-radius:14px;background:#eef2ec}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.callout{border:1px dashed #b7c9bd;padding:18px;border-radius:14px;margin:22px 0}.btn{border:0;background:var(--green);color:white;padding:11px 18px;border-radius:10px;font-weight:700}.btn.secondary{background:#e6ebe4;color:var(--ink)}.btn.outline{background:transparent;border:1px solid #abc0b2;color:var(--ink)}.btn.danger{background:#f4e5e0;color:#743a30}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:25px;border-top:1px solid var(--line);padding-top:20px}.muted{color:var(--muted);font-size:.91rem}label{display:block;font-weight:700;margin:20px 0 6px}textarea,input[type=text],select{width:100%;border:1px solid #b9c8be;background:#fff;border-radius:10px;padding:12px;color:var(--ink)}textarea{min-height:104px;resize:vertical}.field{padding:8px 0 13px;border-bottom:1px solid #e6e9e2}.field small{display:block;color:var(--muted)}.key-list{counter-reset:key;list-style:none;padding:0}.key-list li{counter-increment:key;display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}.key-list li:before{content:counter(key,decimal-leading-zero);font-weight:800;color:var(--green);min-width:34px}.lessoncard{margin:18px 0;padding:20px 0;border-bottom:1px solid var(--line)}.lessoncard h3{margin:0 0 10px}.lessoncard p{margin:10px 0}.workhint{background:#fbefe7;border-left:4px solid var(--accent);padding:13px 17px;margin:12px 0}.crumb{color:var(--muted);font-size:.85rem}.status{padding:9px 12px;border-radius:8px;background:#edf2ed;color:#285743;margin:12px 0}.hidden{display:none!important}.footer{margin-top:40px;color:var(--muted);font-size:.83rem}.smallcaps{font-size:.74rem;text-transform:uppercase;letter-spacing:.13em;font-weight:800}.cert{background:#fffdf7;border:8px double #2c6d59;text-align:center;padding:48px 25px;margin:25px 0}.cert h2{font-family:Georgia,serif;font-size:clamp(2rem,5vw,3.5rem)}.cert .name{font:italic clamp(1.7rem,4vw,2.6rem) Georgia,serif;border-bottom:1px solid #bbb;padding:14px}.course-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.course-grid button{text-align:left;border:1px solid var(--line);border-radius:15px;background:white;padding:19px;color:var(--ink)}.course-grid button:hover{border-color:var(--green)}.course-grid strong{display:block;font-size:1.15rem}.course-grid span{font-size:.85rem;color:var(--muted)}@media(max-width:600px){header{padding:14px 16px}main{padding:18px 14px 70px}.panel{padding:19px}.nav .btn{flex:1}.cert{padding:26px 12px}}

/* Course identity — adapted from approved visual prototype */
:root{--bg:#f7f4ec;--ink:#193a32;--muted:#63756d;--accent:#c46d4b;--line:#d9ded3;--card:#fffef9;--green:#244d40;--ochre:#d6ae59;--sage:#9db3a6}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.site-header{background:#f9f7f0;color:var(--ink);padding:0 max(20px,calc((100vw - 1170px)/2));border-bottom:1px solid var(--line)}
.header-inner{min-height:88px;display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%}
.brand{display:flex;align-items:center;gap:13px}.brand svg{width:49px;height:49px;flex:none}.brand-name{font-size:.82rem;font-weight:800;letter-spacing:.11em;line-height:1.45}.brand-sub{display:block;font-weight:400;font-size:.72rem;letter-spacing:.04em;color:var(--muted)}.header-status{text-align:right;font-size:.8rem;color:var(--muted)}
main{max-width:1170px;padding:22px 30px 90px}
h1,h2,h3{line-height:1.13}h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:500}h1{font-size:clamp(3.3rem,6.5vw,5.5rem);letter-spacing:-.055em}h2{font-size:clamp(2rem,3.7vw,3rem);letter-spacing:-.04em}h3{letter-spacing:-.015em}
.eyebrow{color:var(--accent);letter-spacing:.18em;font-size:.72rem}
.progress{height:5px;background:#dce3d8}.progress>div{background:var(--accent)}
.modulebar{margin:24px 0 18px;gap:7px}.modulebar button,.steps button{border-radius:4px;background:transparent;border:1px solid var(--line);font-size:.85rem}.modulebar button.active,.steps button.active{background:var(--green);color:#fff;border-color:var(--green)}
.hero{padding:34px 0 38px;border-bottom:1px solid var(--line)}.intro-hero{display:grid;grid-template-columns:1.04fr .96fr;align-items:center;gap:42px;padding:48px 0 72px}.intro-copy h1{margin:18px 0 24px}.intro-copy .lead{max-width:560px;font-size:1.18rem}.intro-copy .btn{margin-top:18px}.hero-art{position:relative;aspect-ratio:1;background:#e8e9dc;overflow:hidden;box-shadow:12px 12px 0 #dce1d4}.hero-art svg{display:block;width:100%;height:100%}.art-caption{position:absolute;bottom:16px;left:20px;font-size:.68rem;text-transform:uppercase;letter-spacing:.13em;font-weight:800;color:#315548}
.module-hero{display:grid;grid-template-columns:1fr 220px;gap:25px;align-items:center}.module-hero .steps{grid-column:1/-1}.module-symbol{background:#e9ece2;display:grid;place-items:center;padding:32px;min-height:190px}.module-symbol svg{width:150px;height:140px;max-width:100%}.module-hero .tag{background:#e7ede3;border-radius:3px;color:var(--green)}
.panel{border-radius:3px;box-shadow:none;margin:28px 0;padding:clamp(24px,4vw,45px)}.example,.mini{border-radius:2px;background:#eff1e9}.callout{border-radius:3px;border:1px solid var(--sage);background:#f6f7f1}.quote{background:#f5eee3;border-left-color:var(--accent)}.btn{background:var(--green);border-radius:4px;padding:12px 19px}.btn:hover{filter:brightness(.9)}.btn.secondary{background:#e8ede5}.btn.outline{border-color:var(--sage)}.btn.danger{background:#f4e5e0}
.course-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.course-grid button{border-radius:2px;background:#fffdf7;padding:22px;min-height:190px}.course-grid button svg{display:block;width:66px;height:65px;margin:13px 0}.course-grid button strong{font-family:Georgia,serif;font-size:1.35rem;font-weight:500}.course-grid button span:first-child{color:var(--accent);font-size:.72rem;font-weight:800;letter-spacing:.1em}
.key-list{margin:24px 0}.key-list li{padding:19px 0;border-top:1px solid var(--line);border-bottom:0}.key-list li:last-child{border-bottom:1px solid var(--line)}.key-list li:before{color:var(--accent);font:italic 1.7rem Georgia,serif;min-width:45px}
.lessoncard{padding:24px 0}.lessoncard h3{font-family:Georgia,serif;font-weight:500;font-size:1.45rem}.workhint{background:#f5eee3}
textarea,input[type=text],select{border-radius:4px}.field{padding:14px 0 18px}.footer{border-top:1px solid var(--line);padding-top:20px}
.cert{border:1px solid #d9cfb6;outline:2px solid var(--green);outline-offset:-15px;padding:55px 32px;background:#fffdf6}.cert-mark svg{height:76px;width:76px}.cert-mark{margin:0 auto 14px}.cert h2{font-size:clamp(2.6rem,5vw,4.2rem)}.cert .name{font-size:clamp(2rem,4vw,2.7rem);margin:20px auto;max-width:540px}
@media(max-width:800px){.course-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.intro-hero{gap:25px}.module-hero{grid-template-columns:1fr 160px}.module-symbol{min-height:145px;padding:20px}}
@media(max-width:600px){.site-header{padding:0 17px}.header-inner{min-height:75px}.header-status{display:none}.brand svg{width:43px;height:43px}main{padding:16px 18px 70px}.intro-hero{grid-template-columns:1fr;padding:28px 0 45px}.hero-art{max-width:460px}.module-hero{grid-template-columns:1fr}.module-symbol{display:none}.course-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.course-grid button{padding:14px;min-height:155px}.course-grid button svg{width:48px;height:48px;margin:10px 0}.panel{padding:23px 19px}.cert{padding:35px 23px}}
@media(max-width:390px){.course-grid{grid-template-columns:1fr}}

/* Persistent course progress guide */
.course-progress-guide{margin:18px 0 24px;padding:20px;border:1px solid var(--line);border-radius:18px;background:#fffefa}
.course-progress-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.course-progress-head h2{font:700 1.08rem/1.3 system-ui,sans-serif;margin:0;letter-spacing:0}
.course-progress-count{color:var(--green);font-weight:800;font-size:.91rem}
.course-progress-list{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.course-progress-item{border:1px solid #d8dfd6;background:#f7f8f3;border-radius:12px;padding:10px 6px;text-align:center;color:var(--ink);min-width:0;cursor:pointer}
.course-progress-item .progress-icon{display:block;font-size:1.18rem;font-weight:800;line-height:1.2}
.course-progress-item .progress-name{display:block;font-size:.76rem;font-weight:750;margin-top:5px}
.course-progress-item .progress-state{display:block;font-size:.66rem;color:var(--muted);margin-top:2px}
.course-progress-item.done{background:#e7f1e8;border-color:#83aa90}.course-progress-item.done .progress-icon{color:#276449}
.course-progress-item.current{outline:2px solid var(--accent);outline-offset:1px;background:#fff7ef}
.course-progress-item:hover{border-color:var(--green)}
.course-progress-help{font-size:.82rem;color:var(--muted);margin:10px 0 0}
.complete-action{background:#e8f2e8;border:2px solid #7ea78a;border-radius:15px;padding:22px;margin:22px 0}
.complete-action h3{margin:0 0 8px}.complete-action p{margin:0 0 14px}
@media(max-width:680px){.course-progress-list{grid-template-columns:repeat(3,minmax(0,1fr))}.course-progress-guide{padding:14px}}

/* Certificate preview: same centered composition as the printable certificate. */
.cert{position:relative;box-sizing:border-box;aspect-ratio:11/8.5;width:100%;background:#f9f7f0;border:5px solid #24576a;outline:none;padding:clamp(25px,4vw,55px);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0;text-align:center;overflow:hidden}
.cert::before{content:"";position:absolute;inset:12px;border:1.5px solid #c7a45c;pointer-events:none}
.cert>*{position:relative;z-index:1;max-width:100%}
.cert .cert-mark{margin:0 0 12px}.cert .cert-mark svg{width:clamp(44px,6vw,76px);height:clamp(44px,6vw,76px)}
.cert .cert-eyebrow{font:700 clamp(9px,1.25vw,14px) system-ui,sans-serif;letter-spacing:.2em;color:#285b4d;margin:0 0 12px}
.cert .cert-heading{font:700 clamp(22px,3.4vw,43px)/1.12 Georgia,serif;text-transform:uppercase;letter-spacing:.065em;margin:0 0 clamp(14px,2.3vw,28px);border:0;padding:0}
.cert p{max-width:none;margin:0}.cert .cert-intro{font:clamp(12px,1.5vw,18px) Georgia,serif;margin-bottom:12px}
.cert .name{font:700 italic clamp(23px,3.6vw,46px)/1.15 Georgia,serif;border:0;margin:0 0 clamp(12px,2vw,24px);padding:0;overflow-wrap:anywhere}
.cert .cert-completed{font:clamp(11px,1.35vw,17px) Georgia,serif;margin-bottom:7px}
.cert .cert-course{font:700 clamp(19px,2.6vw,32px)/1.15 Georgia,serif;letter-spacing:0;margin:0 0 7px}
.cert .cert-subtitle{font:clamp(12px,1.65vw,20px) Georgia,serif;margin-bottom:clamp(12px,2vw,23px)}
.cert .cert-practices{font:clamp(10px,1.35vw,16px) Georgia,serif;margin-bottom:clamp(10px,1.8vw,20px)}
.cert .cert-date{font:clamp(11px,1.3vw,16px) Georgia,serif;margin-bottom:clamp(13px,2vw,25px)}
.cert .cert-disclaimer{font:clamp(9px,1vw,12px) Georgia,serif;color:#586a65}
@media(max-width:650px){.cert{aspect-ratio:auto;min-height:510px;padding:35px 24px}.cert .cert-heading{font-size:24px}.cert .cert-eyebrow{letter-spacing:.12em}.cert .cert-course{font-size:22px}}
</style></head><body><header class="site-header"><div class="header-inner"><div class="brand"><svg aria-label="Innovation course emblem" class="mark" viewbox="0 0 100 100"><circle cx="50" cy="50" fill="#244d40" r="45"></circle><circle cx="32" cy="32" fill="#d6ae59" r="11"></circle><circle cx="68" cy="34" fill="#f7f4ec" r="11"></circle><circle cx="51" cy="70" fill="#c46d4b" r="11"></circle><path d="M40 36 58 36 M36 42 46 60 M63 43 55 59" stroke="#f7f4ec" stroke-width="3"></path></svg><span class="brand-name">THE PRACTICE<br>OF INNOVATION<span class="brand-sub">From Possibility to Adoption</span></span></div><div id="topStatus" class="header-status">Six practices · One evolving project</div></div></header><div class="progress"><div id="progressBar" style="width:0%"></div></div><main><div class="modulebar" id="moduleBar"></div><section id="courseProgressGuide" class="course-progress-guide" aria-label="Course completion progress"></section><div id="content"></div><div class="footer">A self-contained learning experience. Progress is saved in this browser when storage is available. Export a backup before changing browsers or devices. Optional AI tools are never required.</div></main><script>
const BRAND_MARK='<svg aria-label="Innovation course emblem" class="mark" viewbox="0 0 100 100"><circle cx="50" cy="50" fill="#244d40" r="45"></circle><circle cx="32" cy="32" fill="#d6ae59" r="11"></circle><circle cx="68" cy="34" fill="#f7f4ec" r="11"></circle><circle cx="51" cy="70" fill="#c46d4b" r="11"></circle><path d="M40 36 58 36 M36 42 46 60 M63 43 55 59" stroke="#f7f4ec" stroke-width="3"></path></svg>';
const MODULE_ICONS=['<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="48" cy="46" r="30" fill="none" stroke="#244d40" stroke-width="4"/><circle cx="48" cy="46" r="12" fill="#d6ae59"/><path d="M70 69 L90 89" stroke="#c46d4b" stroke-width="8" stroke-linecap="round"/></svg>', '<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 85V44M50 44L20 17M50 44L80 17" stroke="#244d40" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="20" cy="17" r="12" fill="#c46d4b"/><circle cx="80" cy="17" r="12" fill="#d6ae59"/><circle cx="50" cy="85" r="11" fill="#9db3a6"/></svg>', '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="25" cy="25" r="13" fill="#9db3a6"/><circle cx="75" cy="25" r="13" fill="#d6ae59"/><circle cx="25" cy="75" r="13" fill="#c46d4b"/><circle cx="75" cy="75" r="13" fill="#244d40"/><path d="M25 25L75 75" stroke="#244d40" stroke-width="3"/><path d="M75 25L25 75" stroke="#244d40" stroke-width="3"/></svg>', '<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="22" y="28" width="56" height="56" fill="none" stroke="#244d40" stroke-width="4"/><path d="M22 28L50 10L78 28" fill="#d6ae59" stroke="#244d40" stroke-width="3"/><circle cx="50" cy="56" r="14" fill="#c46d4b"/></svg>', '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="20" cy="50" r="13" fill="#c46d4b"/><circle cx="80" cy="20" r="11" fill="#d6ae59"/><circle cx="80" cy="80" r="11" fill="#9db3a6"/><path d="M34 50L69 22M34 50L69 78" stroke="#244d40" stroke-width="5" fill="none"/></svg>', '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="34" fill="none" stroke="#9db3a6" stroke-width="5"/><path d="M25 52L43 69L78 30" fill="none" stroke="#244d40" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="78" cy="30" r="8" fill="#c46d4b"/></svg>'];
const MODULES=[{"id": 1, "group": "DISCOVER", "name": "Observe", "subtitle": "The art of seeing possibility", "duration": "15–20 min", "lead": "Innovation starts when we notice what others have learned to tolerate.", "objectives": ["Recognize friction, workarounds, unmet needs, and delight.", "Distinguish direct observation from interpretation.", "Identify behavior that may reveal unmet needs.", "Frame an open opportunity without prescribing a solution.", "Document how your understanding evolved."], "lessons": [["Notice the ordinary", "A toothpaste tube is a useful reminder: the product can stay the same while the experience around it improves. Earlier metal tubes could crease and be awkward to empty. A more flexible container changed an everyday interaction. Innovation does not require an extraordinary starting point.", "Think about a familiar task that requires unnecessary steps. What happens, specifically, and who experiences it?"], ["Separate evidence from inference", "“She tapped the screen three times and asked for help” describes behavior. “She is bad with technology” is an interpretation. Interpretations can point toward questions, but they are not evidence. Capture what you saw or heard before deciding what it means.", "A shopper opens three different store apps to find coupons. Observed: three apps, repeated navigation. Inferred: the shopper wants a single app. The second statement has not yet been established."], ["Watch for workarounds", "Workarounds are especially revealing. When someone keeps a handwritten cheat sheet, asks a colleague for help, or repeats a task manually, they are adapting to an experience that may not serve them well. Also notice delight: moments when something works surprisingly well.", "A meeting starts late while participants search for the latest document. Before calling it a preparation problem, observe where people look and how they determine which version is current."], ["Frame the opportunity", "An opportunity statement describes a situation worth exploring without smuggling in a preferred solution. “Build a better app” narrows the answer too early. “How might we help people find the information they need without repeated searching?” keeps alternatives open.", "Instead of “We need a coupon aggregator,” ask “How might we make finding and using relevant grocery savings less burdensome?”"]], "fields": [["obs1", "Observation 1 · What did you actually notice?", "textarea"], ["obs2", "Observation 2 · A different friction, workaround, or delight", "textarea"], ["obs3", "Observation 3 · Another moment worth noticing", "textarea"], ["chosen", "Which observation will you carry forward?", "select:obs1|obs2|obs3"], ["project", "Give your opportunity a working name", "text"], ["people", "Who experiences this situation?", "textarea"], ["inference", "What might you be assuming rather than observing?", "textarea"], ["question", "Frame an open “How might we…” question", "textarea"], ["refined", "Optional: paste an AI-assisted refined observation (preserved separately)", "textarea"], ["working", "Which version should Module 2 use?", "select:original|refined"]], "key": ["Innovation begins with noticing everyday friction, workarounds, and delight.", "Observation and interpretation are not the same thing.", "Behavior can reveal needs that people struggle to articulate.", "An open opportunity invites exploration rather than a predetermined solution.", "Documenting how your understanding changes is part of the practice."], "ai": "Act only as an observation partner. Ask at most three focused questions, one at a time, to distinguish what I saw from what I inferred. Do not suggest solutions, assess feasibility, or prioritize. After my answers, provide a brief neutral REFINED OBSERVATION and stop."}, {"id": 2, "group": "DISCOVER", "name": "Imagine", "subtitle": "Expand the space of possibility", "duration": "20–25 min", "lead": "Before choosing an answer, discover how many different answers might exist.", "objectives": ["Explain the difference between divergent and convergent thinking.", "Generate meaningfully different possibilities.", "Identify and challenge assumptions.", "Transfer useful principles from unrelated disciplines.", "Capture a possibility landscape without ranking ideas."], "lessons": [["Open before narrowing", "Divergent thinking deliberately increases the range of possibilities. Convergent thinking later helps choose among them. Both matter, but mixing them too early is like editing the first sentence before you know what the story could be. In this module, quantity and variety are more useful than immediate judgment.", "If a museum wants shorter queues, possibilities might involve appointment windows, exhibits in the queue, remote check-in, or making waiting unnecessary. These are different directions, not merely variations of the same sign."], ["Change the angle", "Ask what the situation looks like from different perspectives: the person experiencing it, a helper, a newcomer, or someone with different abilities. Change the scale, setting, or sequence. A useful divergence exercise seeks differences in underlying approach, not just cosmetic changes.", "For a confusing phone experience: simplify choices; make recovery easier; provide a shared support view; teach through familiar analogies. Do not decide which is best yet."], ["Challenge a hidden rule", "Many solutions inherit assumptions that no one has examined. Write an assumption as a sentence, reverse it, and ask what possibilities appear. This is not a claim that the reverse is correct. It is a tool for discovering alternatives.", "Assumption: every service needs its own app. Reversal: a person might accomplish a task without opening the service app. What new arrangements could that make possible?"], ["Look across boundaries", "Frans Johansson’s The Medici Effect explores the creative potential of intersections between fields. Borrow a principle rather than copying an object. A restaurant menu, airport wayfinding system, or museum audio guide may offer an unexpected way to think about a different problem.", "Airport wayfinding reduces decisions through clear landmarks and progressive disclosure. How could that principle help someone navigate a complex digital task?"]], "fields": [["direction1", "Possibility A · One approach", "textarea"], ["direction2", "Possibility B · A fundamentally different approach", "textarea"], ["direction3", "Possibility C · Another approach", "textarea"], ["direction4", "Possibility D · Push further", "textarea"], ["assumption", "What rule are you taking for granted?", "textarea"], ["reversal", "Reverse or remove that rule", "textarea"], ["newpossibility", "What becomes possible after the reversal?", "textarea"], ["field", "Choose an unrelated field or experience", "select:airports|libraries|restaurants|gardening|theater|sports|other"], ["principle", "What useful principle can you borrow?", "textarea"], ["intersection", "Apply that principle to your opportunity", "textarea"]], "key": ["Divergence expands possibilities; convergence helps choose later.", "Different approaches matter more than cosmetic variations.", "Assumptions are invitations to explore, not unquestionable rules.", "Unexpected intersections can reveal useful new approaches.", "Capture possibilities without judging them prematurely."], "ai": "Act only as a divergent-thinking partner. Offer up to four genuinely different angles and one unexpected analogy. Do not rank, score, select, discuss feasibility, or propose a development plan. End with a short POSSIBILITY LANDSCAPE and stop."}, {"id": 3, "group": "ACT", "name": "Select", "subtitle": "Choose what deserves a test", "duration": "20–25 min", "lead": "A good choice is not a prediction of certainty. It is a reasoned decision about what to learn next.", "objectives": ["Distinguish a promising possibility from a proven solution.", "Articulate selection criteria connected to people and value.", "Identify assumptions and uncertainty.", "Choose one direction and explain why.", "Define evidence that could change the decision."], "lessons": [["Converge deliberately", "After divergence comes convergence. Selection does not mean finding the one perfect idea. It means deciding which possibility is worth investing attention in now. Criteria should connect to the situation you observed, not simply which idea sounds impressive.", "A team might compare possibilities by relevance to the observed need, ease of testing, and potential value. A novel idea with no clear user benefit may be less useful than a modest change people can try."], ["Name the assumptions", "Every idea contains claims about people and the world. “People will trust this,” “This saves time,” and “We can deliver it” are hypotheses, not facts. Make them visible. The riskiest assumption is often the one that would invalidate the entire direction if false.", "For a shared coupon organizer: will shoppers trust it with account access? Can it connect to stores? Would they use it often enough to matter? These are different uncertainties."], ["Choose a learning bet", "You do not need to build the whole solution to make progress. Choose the direction that could teach you something important with a manageable next step. Explain what evidence would make you reconsider. That keeps selection rigorous without making it rigid.", "A paper sketch shown to five people may expose confusing navigation before any software exists. This is not proof of adoption, but it can help determine whether a concept deserves further work."], ["Keep alternatives visible", "A decision is a commitment for now, not a declaration that all other ideas are bad. Preserve your possibility landscape. New evidence may make an earlier alternative more attractive.", "A selected direction should have a clear rationale, a critical assumption, and a way to learn whether that assumption holds."]], "fields": [["criteria", "What three criteria matter most, and why?", "textarea"], ["selectedIdea", "Which possibility will you develop?", "textarea"], ["rationale", "Why is this the best direction to explore now?", "textarea"], ["criticalAssumption", "What assumption could make this direction fail?", "textarea"], ["evidence", "What evidence would change your mind?", "textarea"]], "key": ["Selection is a reasoned bet, not a claim of certainty.", "Use criteria tied to people and the value they may receive.", "Make important assumptions explicit.", "Choose a direction that can produce useful learning.", "Keep alternatives available as evidence emerges."], "ai": "Act only as a selection-thinking partner. Help me articulate criteria, assumptions, and evidence. Ask at most three questions, one at a time. Do not make the decision for me or claim an idea will succeed. End with a neutral DECISION BRIEF and stop."}, {"id": 4, "group": "ACT", "name": "Create", "subtitle": "Make the possibility tangible", "duration": "20–25 min", "lead": "An idea becomes testable when someone can see, touch, use, or experience a version of it.", "objectives": ["Distinguish a concept from a tangible prototype.", "Choose a prototype appropriate to a learning question.", "Describe the smallest useful test.", "Plan to observe real behavior rather than collect only opinions.", "Record what was learned and what remains unknown."], "lessons": [["Make something encounterable", "A sketch, role-play, paper mockup, clickable demo, service script, or physical model can all be prototypes. The purpose is not polish. The purpose is to make a possibility concrete enough that someone can respond to it.", "A new way to navigate a phone could begin as five paper screens with large labeled choices. The learner can watch where someone taps before writing code."], ["Prototype the uncertainty", "Choose the smallest artifact that exposes your most important question. If you need to know whether instructions are understandable, a storyboard may be enough. If you need to know whether a mechanism works, you may need a functional model.", "Do not build an entire scheduling platform to test whether people understand a new appointment flow. Show the flow first."], ["Observe use, not applause", "“I love it” is encouraging but weak evidence. Ask someone to attempt a realistic task without coaching. Notice hesitation, mistakes, workarounds, and unexpected successes. Ask what happened rather than defending the design.", "A participant says a prototype is simple but cannot complete the first task. Their behavior provides more useful information than the compliment."], ["Iterate with a record", "Describe what changed between versions and why. If no one is available to test yet, document the prototype and a concrete test plan. An honest plan is better than invented results.", "Version 1 might reveal unclear labels. Version 2 changes the labels. The next test should show whether the change improved understanding."]], "fields": [["artifact", "What will you make tangible? Describe the prototype.", "textarea"], ["learningQuestion", "What single question should the prototype answer?", "textarea"], ["smallTest", "What is the smallest useful test?", "textarea"], ["task", "What realistic task will someone attempt?", "textarea"], ["observedResults", "What actually happened? Leave blank if not yet tested.", "textarea"], ["iteration", "What would you change based on evidence?", "textarea"]], "key": ["A prototype makes an idea encounterable and testable.", "Prototype the most important uncertainty, not the entire product.", "Real behavior is stronger evidence than polite enthusiasm.", "Record what happened rather than inventing outcomes.", "Iteration turns evidence into a better next version."], "ai": "Act only as a prototyping coach. Help me identify the smallest artifact and one observable test. Do not pretend tests have happened, invent user feedback, or move into launch strategy. End with a concise PROTOTYPE TEST PLAN and stop."}, {"id": 5, "group": "ADOPT", "name": "Distribute", "subtitle": "Make the creation accessible", "duration": "15–20 min", "lead": "Something cannot be adopted if people never encounter it or cannot try it.", "objectives": ["Explain the distinction between creating and making available.", "Identify a reachable first audience.", "Describe the invitation and access path.", "Anticipate practical barriers to trying the creation.", "Design a small, ethical invitation to use it."], "lessons": [["A creation needs a path to people", "Making something tangible is not the same as making it available. Distribution is the bridge between a prototype and the people who might benefit. It includes awareness, access, instructions, and the first opportunity to try.", "A helpful guide saved on your computer cannot help others until it is shared in a place they can find and use."], ["Start with a reachable audience", "“Everyone” is rarely a useful first audience. Begin with people who actually experience the situation and whom you can invite respectfully. Be clear about what you are offering and what you hope to learn.", "A new checklist for volunteer coordinators might first be shared with two coordinators who regularly run events, not marketed to every nonprofit."], ["Reduce the cost of trying", "People may need time, permission, training, trust, accessibility, or reassurance. These are not merely marketing issues. They shape whether someone can even experience the creation.", "A trial that requires a long registration process may fail before the useful part begins. A guided, no-account demonstration might lower the barrier."], ["Invitation is not adoption", "A link opened, a prototype downloaded, or a demonstration attended indicates exposure or trial. It does not yet show sustained value. Record these steps honestly and carry the question of actual use into Module 6.", "Ten people viewing a demo is encouraging reach, not evidence that ten people adopted the product."]], "fields": [["audience", "Who is your reachable first audience?", "textarea"], ["channel", "How will they encounter your creation?", "textarea"], ["invitation", "Write a short, clear invitation to try it", "textarea"], ["barriers", "What might prevent someone from trying it?", "textarea"], ["accessPlan", "How could you reduce those barriers?", "textarea"], ["trialSignal", "What would count as a genuine trial, not merely exposure?", "textarea"]], "key": ["Distribution creates a path from creation to people.", "A specific first audience is more useful than “everyone.”", "Access, trust, and effort influence whether people try something.", "Inviting a trial is different from demonstrating adoption.", "Record reach and trial honestly."], "ai": "Act only as a distribution-thinking partner. Help me clarify a first audience, invitation, and access barriers. Do not claim adoption or suggest aggressive marketing tactics. End with a concise FIRST-TRIAL INVITATION PLAN and stop."}, {"id": 6, "group": "ADOPT", "name": "Adopt", "subtitle": "Discover whether value endures", "duration": "20–25 min", "lead": "The real test of innovation is not whether people praise a creation, but whether it becomes useful in their lives.", "objectives": ["Distinguish awareness, trial, repeated use, and adoption.", "Identify barriers and reasons people resist change.", "Define meaningful evidence of delivered value.", "Reflect on actual results without exaggeration.", "Choose a responsible next iteration or learning step."], "lessons": [["Adoption is a progression", "People may hear about something, examine it, try it, use it again, and eventually integrate it into a routine. Those stages are different. Everett Rogers’s work on diffusion helps explain why adoption is a social process, not simply a product feature.", "A person downloading an app has tried to access it. Using it to complete a task is stronger evidence. Returning to it when the need arises is stronger still."], ["Understand resistance", "Resistance is not always stubbornness. A new approach may impose switching costs, disrupt habits, require trust, or fail to fit an existing workflow. Ask what people would have to stop doing, learn, or risk.", "A faster workflow may still be rejected if it removes a familiar checkpoint people rely on for confidence."], ["Look for evidence of value", "Define what meaningful use would look like for your particular creation. Sometimes the outcome is time saved; sometimes fewer errors, less anxiety, greater access, or delight. Choose measures that reflect the user’s experience.", "A guide meant to reduce confusion should be judged by whether people can complete tasks more confidently, not simply by how many pages were viewed."], ["Complete the learning loop", "Your course project does not have to achieve widespread adoption to be successful as a learning experience. What matters is whether you took action, sought real evidence where possible, and can explain what you learned and would do next. Do not invent results if you have not tested yet.", "An honest outcome might be: “Two people tried the prototype, one returned to it, and I still need to test whether the benefit lasts.”"]], "fields": [["valueSignal", "What would meaningful value look like for your audience?", "textarea"], ["adoptionStages", "How will you distinguish exposure, trial, and repeated use?", "textarea"], ["resistance", "What might make people reluctant to change?", "textarea"], ["actualEvidence", "What evidence do you actually have so far? Leave blank if not tested.", "textarea"], ["nextIteration", "What will you learn or change next?", "textarea"], ["finalReflection", "What did this innovation journey teach you?", "textarea"]], "key": ["Awareness, trial, and sustained adoption are different stages.", "Resistance often reflects real costs, risks, and habits.", "Measure value from the user’s perspective.", "Report evidence honestly, including uncertainty and incomplete testing.", "Innovation is a continuing practice of creation, learning, and adoption."], "ai": "Act only as an adoption-evidence partner. Help me distinguish exposure, trial, repeated use, and actual value. Ask up to three questions, one at a time. Do not invent metrics or declare success without evidence. End with a balanced ADOPTION LEARNING SUMMARY and stop."}];
const KEY='innovation_full_course_v1';const OLDKEY='innovation-course-m1-v1';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=v=>esc(v||'—').replace(/\n/g,'<br>');
const fresh=()=>({page:'intro',module:1,section:0,completed:[],modules:{},archives:{},name:'',certificateDate:'',migrated:false});
let state;try{state={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){state=fresh()}
if(!state.modules||typeof state.modules!=='object')state.modules={};if(!state.archives||typeof state.archives!=='object')state.archives={};if(!Array.isArray(state.completed))state.completed=[];
const $=id=>document.getElementById(id);const get=m=>state.modules[m]||(state.modules[m]={});
function convertLegacy(d){const chosen='obs'+(d.selectedObservation||1);return {obs1:d.obs1||'',obs2:d.obs2||'',obs3:d.obs3||'',chosen,project:d.project||'',people:d.people||'',inference:'',question:d.question||'',refined:d.refinedObservation||'',working:d.workingVersion==='refined'?'refined':'original',reflection:d.reflection||'',aiNotes:'',legacyOriginal:d.originalOpportunity||d.opportunity||''}}
try{if(!state.migrated&&!state.modules[1]){const old=JSON.parse(localStorage.getItem(OLDKEY)||'null');if(old&&typeof old==='object'){state.modules[1]=convertLegacy(old);state.migrated=true;localStorage.setItem(KEY,JSON.stringify(state))}}}catch(e){}

function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function download(name,data,type){const u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1200)}
function show(page,module,section){state.page=page;if(module)state.module=module;if(section!==undefined)state.section=section;save();render();window.scrollTo(0,0)}
function bar(){let entries=[['intro','Welcome'],...MODULES.map(m=>['module',m.name,m.id]),['finish','Finish']];$('moduleBar').innerHTML=entries.map(([page,label,id])=>`<button class="${state.page===page&&(page!=='module'||state.module===id)?'active':''}" data-page="${page}" data-id="${id||''}">${page==='module'&&state.completed.includes(id)?'✓ ':''}${esc(label)}</button>`).join('');$('moduleBar').querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.page,Number(b.dataset.id)||undefined,0));const count=state.completed.length;$('progressBar').style.width=`${Math.round(count/6*100)}%`;$('topStatus').innerHTML=`${count} of 6 modules completed<br>${state.page==='module'?'Module '+state.module+' of 6':'Six practices · One project'}`}
function progressGuide(){
 const count=state.completed.filter(id=>Number.isInteger(id)&&id>=1&&id<=6).length;
 $('courseProgressGuide').innerHTML=`<div class="course-progress-head"><h2>Your course progress</h2><span class="course-progress-count">${count} of 6 modules completed · ${Math.round(count/6*100)}%</span></div><div class="course-progress-list">${MODULES.map(m=>{const done=state.completed.includes(m.id),current=state.page==='module'&&state.module===m.id;return `<button type="button" class="course-progress-item ${done?'done':''} ${current?'current':''}" data-progress-module="${m.id}" aria-label="Module ${m.id}, ${esc(m.name)}, ${done?'completed':'not completed'}${current?', current module':''}"><span class="progress-icon" aria-hidden="true">${done?'✓':String(m.id).padStart(2,'0')}</span><span class="progress-name">${esc(m.name)}</span><span class="progress-state">${done?'Completed':current?'In progress':'Not completed'}</span></button>`}).join('')}</div><p class="course-progress-help">Select a module to revisit it. At the end of its Key Messages, choose <strong>Mark complete &amp; continue</strong>. Visiting the next module alone does not mark the previous one complete.</p>`;
 $('courseProgressGuide').querySelectorAll('[data-progress-module]').forEach(b=>b.onclick=()=>show('module',Number(b.dataset.progressModule),0));
}
function intro(){return `<div class="hero intro-hero"><div class="intro-copy"><div class="eyebrow">A course in seeing, making, and sharing</div><h1>Innovation<br>is a <em>practice.</em></h1><p class="lead">Not a lightning strike. Not a gift reserved for a few. Six learnable practices, one project that grows with you.</p><p>Innovation begins with noticing, becomes real through action, and matters when people find value in what has been created.</p><button class="btn" id="startCourse">Begin Module 1: Observe →</button></div><div class="hero-art"><svg aria-label="Abstract illustration of connections, exploration, and a path from observation to adoption" role="img" viewbox="0 0 600 600"><rect fill="#e8e9dc" height="600" width="600"></rect><circle cx="300" cy="300" fill="none" r="190" stroke="#a8b9a9" stroke-width="1.5"></circle><circle cx="300" cy="300" fill="none" r="126" stroke="#a8b9a9" stroke-width="1.5"></circle><path d="M70 432 C160 370 160 220 275 258 S430 370 518 128" fill="none" stroke="#244d40" stroke-linecap="round" stroke-width="10"></path><path d="M76 135 487 488" stroke="#c46d4b" stroke-dasharray="8 12" stroke-width="2"></path><circle cx="149" cy="350" fill="#c46d4b" r="59"></circle><circle cx="149" cy="350" fill="#f7f4ec" r="22"></circle><circle cx="297" cy="264" fill="#d6ae59" r="82"></circle><path d="M297 203 V325 M236 264 H358" stroke="#244d40" stroke-width="3"></path><circle cx="452" cy="272" fill="#244d40" r="54"></circle><circle cx="452" cy="272" fill="#f7f4ec" r="18"></circle><path d="M405 420 L498 420 L452 499 Z" fill="#9db3a6"></path><circle cx="485" cy="129" fill="#c46d4b" r="19"></circle><path d="M80 85h100m-100 13h54M400 540h110" stroke="#244d40" stroke-width="2"></path><g fill="#244d40" font-family="sans-serif" font-size="14" letter-spacing="2"><text x="74" y="74">NOTICE</text><text x="425" y="563">CONNECT</text></g></svg><div class="art-caption">Notice · Connect · Create</div></div></div><div class="panel"><div class="eyebrow">Your learning journey</div><h2>Discover → Act → Adopt</h2><div class="cards"><div class="mini"><b>Discover · Modules 1–2</b>Observe the world closely. Imagine more than one possible future.</div><div class="mini"><b>Act · Modules 3–4</b>Select a direction and make something tangible enough to test.</div><div class="mini"><b>Adopt · Modules 5–6</b>Help people encounter the creation and learn whether it delivers value through use.</div></div><h3>How the course works</h3><p>Each module follows the same pattern: <strong>Learning objectives → Teach → Demonstrate → Practice → Reflect → Key messages.</strong> You'll build an Innovation Portfolio as you go. Real-world tests may take longer than the lessons; you can return whenever you're ready.</p><p>AI is optional. Each module includes a bounded companion prompt, but every lesson and activity works independently.</p><div class="callout"><strong>Your capstone</strong><p>Start with an observation. Carry it through imagination, selection, creation, distribution, and adoption. You are not required to prove widespread adoption or invent test results to complete the course.</p></div></div><div class="panel"><h3>Course map</h3><div class="course-grid">${MODULES.map(m=>`<button data-jump="${m.id}"><span>${m.group} · MODULE ${m.id}</span>${MODULE_ICONS[m.id-1]}<strong>${esc(m.name)}</strong><span>${esc(m.subtitle)}</span></button>`).join('')}</div></div><div class="panel"><h3>Your work stays yours</h3><p>Work is saved locally in your browser. Use JSON backup to move between devices. Print your portfolio to PDF, or export plain text. A module reset archives that module's answers before clearing its working fields.</p>${backupControls()}</div>`}
function backupControls(){return `<div class="row"><button class="btn secondary" id="exportJSON">Export progress · JSON</button><button class="btn secondary" id="importJSON">Import progress · JSON</button><button class="btn outline" id="exportTXT">Download portfolio · TXT</button><button class="btn outline" id="printPortfolio">Print / Save portfolio · PDF</button><input type="file" id="backupFile" accept="application/json,.json" hidden></div><p class="muted">You can also import a JSON backup exported from the earlier standalone Module 1 prototype.</p><p id="backupMessage" class="muted" role="status"></p>`}
function moduleHtml(m){const d=get(m.id),s=state.section;let sections=['Begin','Learn','Practice','Reflect','Key messages'];let chosen=get(1).chosen||'obs1';let observation=(get(1).working==='refined'&&get(1).refined?get(1).refined:get(1)[chosen])||'';let pre=`<div class="hero module-hero"><div class="module-hero-text"><span class="tag">${m.group} · MODULE ${String(m.id).padStart(2,'0')}</span><h1>${esc(m.name)}.<br>${esc(m.subtitle)}.</h1><p class="lead">${esc(m.lead)}</p><p class="muted">${esc(m.duration)} of guided learning · Your work saves automatically</p></div><div class="module-symbol" aria-hidden="true">${MODULE_ICONS[m.id-1]}</div><div class="steps">${sections.map((t,i)=>`<button class="${i===s?'active':''}" data-section="${i}">${i+1}. ${t}</button>`).join('')}</div></div>`;
let inner='';
if(s===0)inner=`<div class="eyebrow">01 · Begin</div><h2>What you'll learn</h2><p>By the end of this module, you'll be able to:</p><ol>${m.objectives.map(o=>`<li>${esc(o)}</li>`).join('')}</ol><div class="quote">${esc(m.lead)}</div><p>We'll first explain the concepts, then work through examples, and finally apply them to your own project. You can revisit any part of the lesson at any time.</p>${m.id>1?`<div class="example"><strong>Carried forward from Module 1</strong><p>${nl(observation)}</p><p class="muted">This is the working observation you selected. To change it, return to Module 1 and update your choice; your original observation remains saved.</p></div>`:''}`;
if(s===1)inner=`<div class="eyebrow">02 · Teach & demonstrate</div><h2>Learn the practice</h2>${m.lessons.map((l,i)=>`<article class="lessoncard"><span class="eyebrow">Concept ${i+1} of ${m.lessons.length}</span><h3>${esc(l[0])}</h3><p>${esc(l[1])}</p><div class="example"><strong>Worked example</strong><p>${esc(l[2])}</p></div></article>`).join('')}<p class="muted">These examples are illustrations, not results from your own project.</p>`;
if(s===2){let intro=m.id===1?'Record three separate observations, then choose one to develop. Choosing does not delete the other two.':m.id===2?'Generate multiple directions without judging them yet. The Intersection Explorer is an analogy exercise, not an idea ranking tool.':m.id===3?'Make a reasoned choice while preserving your other possibilities.':m.id===4?'Describe what you have actually made or plan to make. Do not invent test results.':m.id===5?'Design a realistic invitation to a first audience.':'Distinguish actual evidence from what you hope will happen.';inner=`<div class="eyebrow">03 · Guided practice & capstone</div><h2>Apply it to your opportunity</h2><p>${esc(intro)}</p>${m.id>1?`<div class="example"><strong>Your working opportunity</strong><p>${nl(observation)}</p><strong>How might we…</strong><p>${nl(get(1).question)}</p></div>`:''}${m.fields.map(([k,label,type])=>fieldHtml(m.id,k,label,type,d[k]||'')).join('')}${m.id===1?`<div class="callout"><strong>Preserving your thinking</strong><p>Your selected original observation remains unchanged. An optional AI refinement is stored separately. The “working version” choice only controls what later modules use.${d.legacyOriginal?'<p><strong>Earlier capstone text (preserved from Module 1):</strong> '+nl(d.legacyOriginal)+'</p>':''}</p></div>`:''}${m.id===2?`<div class="callout"><strong>Intersection Explorer</strong><p>Choose an unfamiliar domain above. Borrow a principle from it, then apply that principle to your opportunity. Aim for an unexpected connection, not a literal copy.</p><p id="analogyHint" class="muted"></p></div>`:''}<div class="status" id="saveStatus">Your entries are saved automatically in this browser.</div>`}
if(s===3)inner=`<div class="eyebrow">04 · Reflect & enrich</div><h2>What changed in your thinking?</h2><p>Pause and articulate what you learned. This reflection becomes part of your Innovation Portfolio.</p>${fieldHtml(m.id,'reflection','Your reflection on this practice','textarea',d.reflection||'')}<div class="callout"><strong>Optional AI companion · ${esc(m.name)}</strong><p>The course stands on its own. If you want a thinking partner, copy this bounded prompt into your preferred LLM or the future Innovation Studio companion. It should support this module only, not pull you into later stages.</p><button class="btn secondary" id="copyPrompt">Copy module-specific AI prompt</button><p class="muted">Any AI-generated summary should be reviewed by you. Keep observations and evidence honest.</p>${fieldHtml(m.id,'aiNotes','Optional · Paste a useful final AI response or summary','textarea',d.aiNotes||'')}</div>`;
if(s===4)inner=`<div class="eyebrow">05 · Reinforce</div><h2>Key messages</h2><p>These five takeaways correspond directly to this module's five learning objectives.</p><ol class="key-list">${m.key.map((k,i)=>`<li><div><strong>${esc(k)}</strong><div class="muted">Learning objective ${i+1}: ${esc(m.objectives[i])}</div></div></li>`).join('')}</ol><div class="quote">${m.id===1?'The goal of observation isn’t to have a great idea. It’s to see something worth thinking about differently.':m.id===6?'A creation becomes an innovation when it delivers value through use. The practice continues beyond this course.':'Keep what you learned. Carry it into the next practice.'}</div><div class="complete-action"><h3>${state.completed.includes(m.id)?'✓ Module ' + m.id + ' completed':'Ready to complete Module ' + m.id + '?'}</h3><p>${state.completed.includes(m.id)?'Your completion is saved. You can revisit and edit this module at any time.':'After reviewing the key messages, mark this module complete to update your progress and move on. You can return to your work later.'}</p><button class="btn" id="completeModule">${state.completed.includes(m.id)?'Continue to ' + (m.id===6?'certificate':'Module '+(m.id+1)) + ' →':'✓ Mark Module '+m.id+' complete &amp; continue →'}</button></div>`;
return pre+`<div class="panel">${inner}<div class="nav"><button class="btn secondary" id="prevSection">← ${s===0?'Course introduction':'Previous'}</button><button class="btn" id="nextSection">${s===4?(state.completed.includes(m.id)?(m.id===6?'Go to certificate →':'Next module →'):'✓ Mark complete & continue →'):'Continue →'}</button></div></div><div class="panel"><div class="row"><button class="btn outline" id="resetModule">↺ Start this module over</button><button class="btn secondary" id="exportJSON">Export progress · JSON</button><button class="btn secondary" id="importJSON">Import progress · JSON</button><button class="btn outline" id="printPortfolio">Print portfolio · PDF</button><input type="file" id="backupFile" accept="application/json,.json" hidden></div><p id="backupMessage" class="muted"></p><div id="archiveArea"></div></div>`}
function fieldHtml(mid,k,label,type,value){let control;if(type.startsWith('select:')){let opts=type.slice(7).split('|');control=`<select data-mid="${mid}" data-key="${esc(k)}"><option value="">Choose an option…</option>${opts.map(o=>`<option value="${esc(o)}" ${value===o?'selected':''}>${esc(o==='obs1'?'Observation 1':o==='obs2'?'Observation 2':o==='obs3'?'Observation 3':o==='original'?'Original observation':o==='refined'?'Refined observation':o[0].toUpperCase()+o.slice(1))}</option>`).join('')}</select>`}else if(type==='text')control=`<input type="text" data-mid="${mid}" data-key="${esc(k)}" value="${esc(value)}" maxlength="500">`;else control=`<textarea data-mid="${mid}" data-key="${esc(k)}" rows="4">${esc(value)}</textarea>`;return `<div class="field"><label for="field-${mid}-${k}">${esc(label)}</label>${control.replace(/^(<\w+)/,`$1 id="field-${mid}-${k}"` )}</div>`}
function finish(){let done=state.completed.length===6;return `<div class="hero"><span class="tag">THE JOURNEY CONTINUES</span><h1>From possibility<br>to adoption.</h1><p class="lead">Innovation is a practice, not a single flash of inspiration.</p></div><div class="panel"><div class="eyebrow">Course synthesis</div><h2>Six practices. One continuous loop.</h2><div class="cards">${MODULES.map(m=>`<div class="mini"><b>${m.id.toString().padStart(2,'0')} · ${m.name}</b>${esc(m.key[0])}</div>`).join('')}</div><div class="quote">Ideas are a starting point. Creation makes them tangible. Adoption reveals whether they deliver value.</div><p>You have practiced observing, imagining, selecting, creating, distributing, and learning from adoption. A project can still be in progress when the course ends. What matters is being able to explain what you made, what you actually learned, and what you would do next.</p><p><strong>Continue the practice:</strong> Choose a real opportunity, invite someone to try a tangible version, watch what happens, and revise your assumptions. Return to earlier modules whenever new evidence changes your understanding.</p><p>${done?'All six modules are marked complete. You can personalize and print your certificate below.':'You have marked '+state.completed.length+' of 6 modules complete. Complete the remaining modules to unlock your certificate.'}</p></div><div class="panel"><h2>Innovation Portfolio</h2><p>Export your complete project and reflections. PDF uses your browser's Print / Save as PDF feature.</p>${backupControls()}</div><div class="panel"><div class="eyebrow">Certificate of completion</div><h2>Celebrate the practice</h2>${done?`<label for="certificateName">Your name, as it should appear on the certificate</label><input id="certificateName" type="text" value="${esc(state.name)}" placeholder="Enter your name"><p class="muted">This is a self-reported completion certificate. No exam or third-party credential is implied.</p><div class="cert"><div class="cert-mark">${BRAND_MARK}</div><div class="cert-eyebrow">THE PRACTICE OF INNOVATION</div><h2 class="cert-heading">Certificate of Completion</h2><p class="cert-intro">This recognizes that</p><div class="name" id="certPreviewName">${esc(state.name||'Your name')}</div><p class="cert-completed">has completed all six learning modules of</p><h3 class="cert-course">The Practice of Innovation</h3><p class="cert-subtitle">From Possibility to Adoption</p><p class="cert-practices">Observe · Imagine · Select · Create · Distribute · Adopt</p><p class="cert-date">${new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}</p><p class="cert-disclaimer">Self-reported course completion · Not a professional credential</p></div><button class="btn" id="printCertificate">Print / Save certificate · PDF</button>`:`<div class="example">Your certificate becomes available after you mark all six modules complete. You may complete the learning without claiming successful market adoption.</div><button class="btn secondary" id="goNext">Go to next incomplete module →</button>`}</div>`}
function portfolioText(){let lines=['THE PRACTICE OF INNOVATION','From Possibility to Adoption','INNOVATION PORTFOLIO',''];for(const m of MODULES){let d=get(m.id);lines.push(`MODULE ${m.id}: ${m.name.toUpperCase()}`,m.subtitle,'');for(const [k,label] of m.fields)lines.push(label, String(d[k]||'—'),'');lines.push('Reflection',d.reflection||'—','Optional AI notes',d.aiNotes||'—','KEY MESSAGES',...m.key.map((x,i)=>`${i+1}. ${x}`),'','---------------------','')}return lines.join('\n')}
function portfolioHtml(){return `<div class="eyebrow">The Practice of Innovation · From Possibility to Adoption</div><h1>My Innovation Portfolio</h1><p>Six practices · One evolving project</p>${MODULES.map(m=>{const d=get(m.id);return `<section><h2>${m.id}. ${esc(m.name)} · ${esc(m.subtitle)}</h2>${m.fields.map(([k,label])=>`<h3>${esc(label)}</h3><p>${nl(d[k])}</p>`).join('')}<h3>Reflection</h3><p>${nl(d.reflection)}</p>${d.aiNotes?`<h3>Optional AI notes</h3><p>${nl(d.aiNotes)}</p>`:''}<h3>Key messages</h3><ol>${m.key.map(k=>`<li>${esc(k)}</li>`).join('')}</ol></section>`}).join('')}`}
function printDoc(title,body){const isCertificate=title==='Certificate of Completion';let w=window.open('','_blank');if(!w){alert('Allow pop-ups to print or save this document as PDF.');return}w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>@page{size:letter;margin:.75in}body{font:12pt/1.5 Georgia,serif;color:#18332e;max-width:800px;margin:35px auto;padding:0 18px}h1{font-size:30pt}h2{font:700 17pt system-ui;border-bottom:2px solid #2c6d59;padding-bottom:6px;margin-top:36px}h3{font:700 11pt system-ui;margin-bottom:4px}p{overflow-wrap:anywhere;margin:6px 0 16px}section{break-before:page}li{margin:8px 0}.eyebrow{font:700 10pt system-ui;letter-spacing:.13em;text-transform:uppercase;color:#2c6d59}.cert-mark svg{width:70px;height:70px}.cert-mark{margin:0 auto 18px}.certificate{border:2px solid #244d40;outline:9px solid #f2f0e7;outline-offset:5px;text-align:center;padding:75px 30px;margin:20px auto;min-height:8in}.certificate h1{font-size:36pt}.certificate .name{font:italic 30pt Georgia,serif;border-bottom:1px solid #bbb;margin:30px 0;padding:15px}@media print{body{margin:0;padding:0}}${isCertificate?`@page{size:letter landscape;margin:.3in}html,body{width:auto;max-width:none;margin:0;padding:0}body{font:12pt/1.35 Georgia,serif}.certificate{box-sizing:border-box;width:100%;height:7.85in;min-height:0;margin:0;padding:.35in .6in;display:flex;flex-direction:column;justify-content:space-around;align-items:center;break-inside:avoid;page-break-inside:avoid;border:2px solid #244d40;outline:6px solid #f2f0e7;outline-offset:-10px}.certificate .cert-mark{margin:0}.certificate .cert-mark svg{width:52px;height:52px}.certificate h1{font-size:29pt;line-height:1.1;margin:0}.certificate h2{font-size:17pt;border:0;padding:0;margin:0}.certificate p{margin:0}.certificate .name{font-size:26pt;line-height:1.1;width:80%;margin:0;padding:8px 0;border-bottom:1px solid #bbb}.certificate .eyebrow{font-size:9pt}.certificate p:last-child{margin:0!important;font-size:9pt!important}@media print{.certificate{height:7.85in}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}} .certificate{position:relative;box-sizing:border-box;width:100%;height:7.85in;min-height:0;margin:0;padding:.48in .65in;background:#f9f7f0;border:5px solid #24576a;outline:none;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0;break-inside:avoid;page-break-inside:avoid;overflow:hidden}.certificate:before{content:'';position:absolute;inset:12px;border:1.5px solid #c7a45c;pointer-events:none}.certificate>*{position:relative;z-index:1}.certificate .cert-mark{margin:0 0 .15in}.certificate .cert-mark svg{width:62px;height:62px}.certificate .eyebrow{font:700 9pt system-ui;letter-spacing:.22em;color:#285b4d;margin:0 0 .12in}.certificate h1{font:700 28pt/1.12 Georgia,serif;text-transform:uppercase;letter-spacing:.09em;margin:0 0 .28in}.certificate .cert-intro{font-size:12pt;margin:0 0 .12in}.certificate .name{font:700 italic 32pt/1.15 Georgia,serif;border:0;width:auto;max-width:90%;margin:0 0 .22in;padding:0;overflow-wrap:anywhere}.certificate .cert-completed{font-size:12pt;margin:0 0 .06in}.certificate h2{font:700 21pt/1.2 Georgia,serif;border:0;margin:0 0 .07in;padding:0}.certificate .cert-subtitle{font-size:13pt;margin:0 0 .22in}.certificate .cert-practices{font-size:11pt;margin:0 0 .22in}.certificate .cert-date{font-size:11pt;margin:0 0 .28in}.certificate .cert-disclaimer{font-size:8.5pt!important;color:#586a65;margin:0!important}.certificate .cert-disclaimer+*{display:none}@media print{html,body{width:100%;height:auto;margin:0!important;padding:0!important}.certificate{height:7.85in;break-after:avoid}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}`:``}</style></head><body>${body}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),350)}
function archiveHtml(mid){const a=state.archives[mid]||[];return a.length?`<h3>Archived Module ${mid} attempts</h3><p class="muted">Resetting preserves a snapshot. Restoring replaces the current answers for this module only.</p>${a.map((x,i)=>`<div class="row"><span class="muted">${esc(x.date||'Earlier attempt')}</span><button class="btn secondary" data-restore="${i}">Restore snapshot ${i+1}</button></div>`).join('')}`:'<p class="muted">No archived attempts for this module yet.</p>'}
function bind(){document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>show('module',Number(b.dataset.jump),0));$('startCourse')?.addEventListener('click',()=>show('module',1,0));document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>show('module',state.module,Number(b.dataset.section)));document.querySelectorAll('[data-mid][data-key]').forEach(el=>{el.oninput=()=>{get(Number(el.dataset.mid))[el.dataset.key]=el.value;save();if(el.dataset.key==='field')$('analogyHint')?.replaceChildren(document.createTextNode('Think about the principle behind the field, not a literal copy.'));};});$('prevSection')?.addEventListener('click',()=>state.section===0?show('intro'):show('module',state.module,state.section-1));$('nextSection')?.addEventListener('click',()=>{if(state.section<4){show('module',state.module,state.section+1)}else{if(!state.completed.includes(state.module))state.completed.push(state.module);save();if(state.module<6)show('module',state.module+1,0);else show('finish')}});$('completeModule')?.addEventListener('click',()=>{if(!state.completed.includes(state.module))state.completed.push(state.module);save();show(state.module===6?'finish':'module',Math.min(6,state.module+1),0)});
$('copyPrompt')?.addEventListener('click',async()=>{const m=MODULES[state.module-1],d=get(m.id),context=Object.entries(d).filter(([k,v])=>typeof v==='string'&&v.trim()&&!['aiNotes','reflection'].includes(k)).map(([k,v])=>`${k}: ${v}`).join('\n');const prompt=`You are my optional companion for Module ${m.id}: ${m.name}, in The Practice of Innovation.\n\n${m.ai}\n\nMy current project context:\n${context||'(No project details entered yet)'}\n\nKeep the interaction brief, focused on this module, and stop at the specified deliverable.`;try{await navigator.clipboard.writeText(prompt);alert('Prompt copied.')}catch(e){window.prompt('Copy this prompt:',prompt)}});
$('resetModule')?.addEventListener('click',()=>{const mid=state.module;if(!confirm(`Start Module ${mid} over? Your current answers will be archived. Only this module’s answers will be cleared; later modules will remain intact.`))return;(state.archives[mid]||(state.archives[mid]=[])).push({date:new Date().toLocaleString(),data:structuredClone(get(mid))});state.modules[mid]={};state.completed=state.completed.filter(x=>x!==mid);save();show('module',mid,0)});
if($('archiveArea')){$('archiveArea').innerHTML=archiveHtml(state.module);document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{const mid=state.module,a=state.archives[mid][Number(b.dataset.restore)];if(!a||!confirm('Restore this snapshot? Current Module '+mid+' answers will be archived first.'))return;state.archives[mid].push({date:new Date().toLocaleString(),data:structuredClone(get(mid))});state.modules[mid]=structuredClone(a.data);save();show('module',mid,0)})}
$('exportJSON')?.addEventListener('click',()=>download('innovation-course-progress.json',JSON.stringify({format:'practice-of-innovation-full',version:1,exportedAt:new Date().toISOString(),state},null,2),'application/json;charset=utf-8'));
$('exportTXT')?.addEventListener('click',()=>download('innovation-portfolio.txt',portfolioText(),'text/plain;charset=utf-8'));
$('printPortfolio')?.addEventListener('click',()=>printDoc('Innovation Portfolio',portfolioHtml()));
$('importJSON')?.addEventListener('click',()=>$('backupFile').click());$('backupFile')?.addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>2e6)throw Error('Backup is too large');let x=JSON.parse(await f.text());if(x.format==='practice-of-innovation'&&x.version===1&&x.modules&&x.modules['1']){if(!confirm('Import your earlier Module 1 work? This will replace only the current Module 1 answers. Other modules will be preserved.'))return;state.modules[1]=convertLegacy(x.modules['1']);if(x.archives&&Array.isArray(x.archives['1']))state.archives[1]=x.archives['1'].map(a=>({date:a.date||'Earlier attempt',data:convertLegacy(a)}));save();render();return}if(x.format!=='practice-of-innovation-full'||x.version!==1||!x.state||typeof x.state!=='object'||!x.state.modules||!x.state.archives||!Array.isArray(x.state.completed))throw Error('Incompatible backup');if(!confirm('Import backup? This will replace the current course progress and archives. Export your current work first if needed.'))return;state={...fresh(),...x.state};save();render()}catch(err){alert('Could not import backup: '+err.message)}finally{e.target.value=''}});
$('certificateName')?.addEventListener('input',e=>{state.name=e.target.value;save();$('certPreviewName').textContent=e.target.value||'Your name'});
$('printCertificate')?.addEventListener('click',()=>{if(state.completed.length!==6)return;const name=esc(state.name.trim()||'Learner');printDoc('Certificate of Completion',`<div class="certificate"><div class="cert-mark">${BRAND_MARK}</div><div class="eyebrow">The Practice of Innovation</div><h1>Certificate of Completion</h1><p class="cert-intro">This recognizes that</p><div class="name">${name}</div><p class="cert-completed">has completed all six learning modules of</p><h2>The Practice of Innovation</h2><p class="cert-subtitle">From Possibility to Adoption</p><p class="cert-practices">Observe · Imagine · Select · Create · Distribute · Adopt</p><p class="cert-date">${esc(new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}))}</p><p class="cert-disclaimer">Self-reported course completion · Not a professional credential</p></div>`)});
$('goNext')?.addEventListener('click',()=>show('module',MODULES.find(m=>!state.completed.includes(m.id))?.id||1,0));}
function render(){bar();progressGuide();$('content').innerHTML=state.page==='intro'?intro():state.page==='finish'?finish():moduleHtml(MODULES[state.module-1]||MODULES[0]);bind()}
render();
</script></body></html>
